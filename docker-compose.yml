services:
  vigil:
    build: .
    container_name: vigil
    restart: unless-stopped
    env_file: .env
    privileged: true
    volumes:
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt:/opt:ro
      - /var/backups/vigil:/var/backups/vigil
      - /etc/localtime:/etc/localtime:ro
    network_mode: host

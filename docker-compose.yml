services:
  vigil:
    # Pin a version in .env with VIGIL_TAG=1.2 (gets 1.2.x fixes) or VIGIL_TAG=1.2.3 (exact)
    image: ghcr.io/vigilopshq/vigil:${VIGIL_TAG:-latest}
    container_name: vigil
    restart: unless-stopped
    env_file: .env
    privileged: true
    volumes:
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt:/opt:ro
      - /var/backups/vigil:/var/backups/vigil
      - /etc/localtime:/etc/localtime:ro
    network_mode: host

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Check shell scripts
        run: shellcheck install.sh scripts/vigil

      - name: Docker image builds
        run: docker build --build-arg VIGIL_VERSION=ci -t vigil:ci .
